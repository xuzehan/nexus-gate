<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NexusGate 账号登录入口"
    />
    <title>NexusGate | 登录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-panel" aria-labelledby="welcome-title">
        <a class="brand" href="./" aria-label="NexusGate 首页">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>NexusGate</span>
        </a>

        <div class="intro-copy">
          <p class="eyebrow">SECURE ACCESS</p>
          <h1 id="welcome-title">
            欢迎回来，
            <span>从这里继续。</span>
          </h1>
          <p class="intro-text">
            一个简单、安全的身份认证入口。使用你的账号登录，继续访问 NexusGate。
          </p>
        </div>

        <ul class="feature-list" aria-label="服务特点">
          <li>
            <span class="feature-icon" aria-hidden="true">01</span>
            <span>bcrypt 密码安全校验</span>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">02</span>
            <span>JWT 访问令牌</span>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">03</span>
            <span>HTTPS 加密连接</span>
          </li>
        </ul>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-content">
          <div class="login-heading">
            <p class="eyebrow">ACCOUNT LOGIN</p>
            <h2 id="login-title">登录账号</h2>
            <p>请输入你的账号信息以继续。</p>
          </div>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="username">用户名</label>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="64"
                placeholder="请输入用户名"
                required
                autofocus
              />
            </div>

            <div class="field">
              <label for="password">密码</label>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="128"
                  placeholder="请输入密码"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-label="显示密码"
                  aria-pressed="false"
                >
                  显示
                </button>
              </div>
            </div>

            <p class="form-message" id="form-message" role="alert"></p>

            <button class="submit-button" id="submit-button" type="submit">
              <span class="submit-label">登录</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>

          <p class="auth-switch">
            <a href="register.html">没有账号？去注册</a>
          </p>

          <p class="security-note">
            登录即表示你已获准访问该系统。请妥善保管账号信息。
          </p>
        </div>

        <footer>
          <span>NexusGate</span>
          <span>Secure by design</span>
        </footer>
      </section>
    </main>

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    >
      <span class="toast-indicator" aria-hidden="true"></span>
      <span id="toast-message"></span>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
